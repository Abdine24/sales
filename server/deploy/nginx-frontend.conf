# Bloc à ajouter sur le VPS pour que CHAQUE sous-domaine de boutique (ex: boutiquea.azanga.tech)
# affiche le site — sans toucher à api.azanga.tech (nginx-api.conf, inchangé) ni aux
# sites/bot déjà servis par ce même Nginx.
#
# Le site lui-même reste hébergé sur GitHub Pages, sur son unique domaine personnalisé
# app.azanga.tech (voir public/CNAME) — GitHub Pages ne sait servir qu'UN SEUL domaine
# personnalisé par dépôt, donc ce n'est pas lui qui peut répondre directement sur
# "n'importe-quoi.azanga.tech". Ce bloc fait juste relais : il reçoit la requête sur le vrai
# sous-domaine demandé par le navigateur, et va chercher les fichiers sur app.azanga.tech —
# tout en laissant le navigateur voir le VRAI sous-domaine dans sa barre d'adresse (c'est un
# reverse proxy, pas une redirection). Comme la détection de boutique se fait côté navigateur
# depuis window.location.hostname (voir src/services/tenant.ts), pas depuis ce que GitHub
# Pages reçoit, tout reste cohérent.
#
# Prérequis AVANT d'installer ce bloc :
#   1. app.azanga.tech configuré comme domaine personnalisé GitHub Pages (public/CNAME +
#      réglage dans Settings -> Pages du dépôt) + son propre DNS CNAME app -> abdine24.github.io
#   2. Un certificat TLS *wildcard* pour *.azanga.tech déjà obtenu (voir
#      README-wildcard-tls.md — nécessite une validation DNS-01, pas le certbot --nginx
#      habituel utilisé pour nginx-api.conf, qui ne marche que pour un nom exact).
#
# Installation (à faire toi-même en SSH sur le VPS, une fois le certificat wildcard en main) :
#
#   sudo nano /etc/nginx/sites-available/boutiques.azanga.tech
#   # colle le contenu ci-dessous (en ayant déjà remplacé les chemins de certificat), sauvegarde
#
#   sudo ln -s /etc/nginx/sites-available/boutiques.azanga.tech /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    # Capture tout sous-domaine SAUF api./app./www. (déjà servis ailleurs) — c'est ce groupe
    # nommé "slug" qui identifie la boutique, transmis tel quel dans le nom d'hôte au frontend
    # (voir X-Tenant-Host côté API, resolveTenant côté serveur — ce bloc ne fait que du
    # transport, aucune logique de tenant ici).
    server_name ~^(?!api\.)(?!app\.)(?!www\.)(?<slug>[a-z0-9-]+)\.azanga\.tech$;

    # Chemins à adapter selon l'outil utilisé pour obtenir le certificat wildcard —
    # voir README-wildcard-tls.md.
    ssl_certificate     /etc/letsencrypt/live/azanga.tech-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/azanga.tech-wildcard/privkey.pem;

    location / {
        proxy_pass https://app.azanga.tech;
        proxy_ssl_server_name on;
        # GitHub Pages sert un site précis par domaine personnalisé configuré — il doit voir
        # "app.azanga.tech" dans le Host, jamais le vrai sous-domaine de la boutique, sinon il
        # répond 404. Le navigateur, lui, garde le vrai sous-domaine dans sa barre d'adresse
        # (un reverse proxy ne le change jamais) : la détection de tenant reste correcte.
        proxy_set_header Host app.azanga.tech;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name ~^(?!api\.)(?!app\.)(?!www\.)(?<slug>[a-z0-9-]+)\.azanga\.tech$;
    location / {
        return 301 https://$host$request_uri;
    }
}
