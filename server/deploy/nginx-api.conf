# Bloc à ajouter sur le VPS pour brancher api.azanga.tech sur l'API Docker (127.0.0.1:3000)
# SANS toucher aux sites/bot déjà servis par ce même Nginx.
#
# Installation (à faire toi-même en SSH sur le VPS) :
#
#   sudo nano /etc/nginx/sites-available/api.azanga.tech
#   # colle le contenu ci-dessous, sauvegarde (Ctrl+O, Entrée, Ctrl+X)
#
#   sudo ln -s /etc/nginx/sites-available/api.azanga.tech /etc/nginx/sites-enabled/
#   sudo nginx -t              # doit afficher "syntax is ok" / "test is successful"
#   sudo systemctl reload nginx
#
#   sudo certbot --nginx -d api.azanga.tech
#   # certbot réécrit automatiquement ce fichier pour ajouter le bloc HTTPS (443) + le
#   # certificat Let's Encrypt. Répondre aux questions (email, redirection HTTP->HTTPS: oui).

server {
    listen 80;
    listen [::]:80;
    server_name api.azanga.tech;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
