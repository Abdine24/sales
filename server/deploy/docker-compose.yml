
# Déployé sur le VPS via l'outil MCP VPS_createNewProjectV1 (projet "vente-api").
# Les valeurs sensibles (mots de passe, clés) ne sont JAMAIS ici — elles sont fournies au
# déploiement via le paramètre `environment`, séparément de ce fichier.
#
# Pas de reverse proxy ici (pas de Caddy) : les ports 80/443 du VPS sont déjà utilisés par
# le Nginx existant (bot Telegram + autres sites). L'API n'expose son port que sur
# 127.0.0.1 — uniquement accessible depuis le VPS lui-même — et c'est le Nginx déjà en place
# qui fait office de reverse proxy HTTPS vers elle (voir server/deploy/nginx-api.conf).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vente
      POSTGRES_USER: vente
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vente"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/abdine24/sales-api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Publié uniquement sur localhost — jamais exposé directement à internet. Le Nginx du
      # VPS (hors Docker) proxy api.azanga.tech vers 127.0.0.1:3000.
      - "127.0.0.1:3000:3000"
    environment:
      PORT: 3000
      # Multi-tenant (voir server/src/db.js) : DATABASE_URL sert de gabarit pour TOUTES les
      # connexions Postgres de l'API (base de contrôle, chaque base boutique, connexion de
      # maintenance) — seul le nom de base change à chaque fois. Pas de variable séparée par
      # usage : un déploiement d'une nouvelle boutique n'ajoute jamais de config ici.
      DATABASE_URL: postgres://vente:${POSTGRES_PASSWORD}@postgres:5432/vente
      SUPABASE_URL: ${SUPABASE_URL}
      LICENSE_SECRET: ${LICENSE_SECRET}
      # Clé service_role Supabase — pouvoirs d'admin complets sur les comptes (créer un
      # employé avec mot de passe, changer le mot de passe de quelqu'un d'autre). Uniquement
      # ici, jamais dans le bundle front. Voir server/src/supabaseAdmin.js.
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      # Notification par email à chaque nouvelle boutique créée (voir server/src/mailer.js,
      # routes/boutiques.js) — optionnelles : sans elles, la création de boutique fonctionne
      # normalement, juste sans notification.
      RESEND_API_KEY: ${RESEND_API_KEY}
      MAIL_FROM: ${MAIL_FROM}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL}
      # Espace propriétaire (voir server/src/routes/plateforme.js) — mot de passe dédié,
      # totalement séparé de Supabase. PLATFORM_OWNER_SECRET signe les sessions ; s'il change,
      # toutes les sessions ouvertes sont invalidées (sans risque : juste une reconnexion).
      PLATFORM_OWNER_PASSWORD: ${PLATFORM_OWNER_PASSWORD}
      PLATFORM_OWNER_SECRET: ${PLATFORM_OWNER_SECRET}

volumes:
  pg_data:
