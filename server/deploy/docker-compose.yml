
# Déployé sur le VPS via l'outil MCP VPS_createNewProjectV1 (projet "vente-api").
# Les valeurs sensibles (mots de passe, clés) ne sont JAMAIS ici — elles sont fournies au
# déploiement via le paramètre `environment`, séparément de ce fichier.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vente
      POSTGRES_USER: vente
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vente"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/abdine24/sales-api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgres://vente:${POSTGRES_PASSWORD}@postgres:5432/vente
      SUPABASE_URL: ${SUPABASE_URL}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    command: >
      sh -c "printf 'api.azanga.tech {\n\treverse_proxy api:3000\n}\n' > /etc/caddy/Caddyfile &&
             caddy run --config /etc/caddy/Caddyfile --adapter caddyfile"

volumes:
  pg_data:
  caddy_data:
  caddy_config:
