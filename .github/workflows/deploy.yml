name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        # VITE_SUPABASE_ANON_KEY n'est pas un secret : Supabase la conçoit pour être publique,
        # protégée par les règles RLS côté base — elle finit de toute façon dans le bundle JS
        # envoyé à chaque visiteur. Pas besoin d'un GitHub Secret pour ça.
        env:
          VITE_SUPABASE_URL: https://cyzipoluiwvhgrizytll.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN5emlwb2x1aXd2aGdyaXp5dGxsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2MDk1MzksImV4cCI6MjEwMzE4NTUzOX0.2RUyJonwkoDa2Jshlofxyc6s7kiFa__C_ZTpm6rv5Vg
          VITE_API_URL: https://api.azanga.tech
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4