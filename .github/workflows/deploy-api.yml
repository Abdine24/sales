name: Build & Push API image

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          # Docker exige un nom d'image en minuscules — repository_owner ("Abdine24") ne l'est
          # pas forcément, d'où le nom fixe plutôt que la variable interpolée.
          tags: ghcr.io/abdine24/sales-api:latest
